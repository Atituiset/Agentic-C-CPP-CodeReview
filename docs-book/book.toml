[book]
title = "Combinate Agentic Review"
authors = ["Combinate Team"]
description = "Enterprise-grade automated AI code review platform for C/C++ repositories"
language = "zh-CN"

[build]
build-dir = "book"

[output.html]
default-theme = "navy"
git-repository-url = "https://github.com/Atituiset/Agentic-C-CPP-CodeReview"
edit-url-template = "https://github.com/Atituiset/Agentic-C-CPP-CodeReview/edit/main/docs-book/src/{path}"

[output.html.search]
enable = true
